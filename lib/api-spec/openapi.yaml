openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: TradersHub professional trading platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: wallet
    description: Wallet management
  - name: trades
    description: Trading operations
  - name: market
    description: Market prices
  - name: mpesa
    description: M-PESA payments
  - name: leaderboard
    description: Leaderboard
  - name: copy-trading
    description: Copy trading
  - name: admin
    description: Admin panel
  - name: dashboard
    description: Dashboard summary
  - name: demo
    description: Demo account management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  # WALLET
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet balance for the selected account
      parameters:
        - name: account
          in: query
          schema:
            type: string
            enum: [real, demo]
            default: real
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  # DASHBOARD
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats for the selected account
      parameters:
        - name: account
          in: query
          schema:
            type: string
            enum: [real, demo]
            default: real
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  # MARKET PRICES
  /market/prices:
    get:
      operationId: getMarketPrices
      tags: [market]
      summary: Get current live market prices
      responses:
        "200":
          description: Market prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketPrice"

  # TRADES
  /trades:
    get:
      operationId: getTrades
      tags: [trades]
      summary: Get all trades for the current user and selected account
      parameters:
        - name: account
          in: query
          schema:
            type: string
            enum: [real, demo]
            default: real
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"
    post:
      operationId: createTrade
      tags: [trades]
      summary: Open a new trade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradeInput"
      responses:
        "201":
          description: Trade opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "400":
          description: Validation error or insufficient balance

  /trades/open:
    get:
      operationId: getOpenTrades
      tags: [trades]
      summary: Get all open positions for the current user and selected account
      parameters:
        - name: account
          in: query
          schema:
            type: string
            enum: [real, demo]
            default: real
      responses:
        "200":
          description: List of open trades with live P/L
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

  /trades/{id}:
    delete:
      operationId: closeTrade
      tags: [trades]
      summary: Close an open position at market price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trade closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trade"
        "404":
          description: Trade not found

  # DEPOSITS
  /deposits:
    get:
      operationId: getDeposits
      tags: [wallet]
      summary: Get deposit history for the selected account
      parameters:
        - name: account
          in: query
          schema:
            type: string
            enum: [real, demo]
            default: real
      responses:
        "200":
          description: Deposit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deposit"

  # DEMO ACCOUNT
  /demo/reset:
    post:
      operationId: resetDemo
      tags: [demo]
      summary: Reset the demo account balance to $10,000
      responses:
        "200":
          description: Demo account reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  # M-PESA
  /mpesa/initiate:
    post:
      operationId: initiateMpesa
      tags: [mpesa]
      summary: Initiate M-PESA STK push
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StkPushInput"
      responses:
        "200":
          description: STK push initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StkPushResponse"

  /mpesa/status/{checkoutRequestId}:
    get:
      operationId: getMpesaStatus
      tags: [mpesa]
      summary: Poll M-PESA deposit status
      parameters:
        - name: checkoutRequestId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deposit status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  /mpesa/callback:
    post:
      operationId: mpesaCallback
      tags: [mpesa]
      summary: M-PESA payment callback (Safaricom webhook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MpesaCallbackInput"
      responses:
        "200":
          description: Callback processed

  # LEADERBOARD
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get top traders leaderboard
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  # COPY TRADING
  /copy-trading/follow:
    post:
      operationId: followTrader
      tags: [copy-trading]
      summary: Follow a trader for copy trading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowInput"
      responses:
        "200":
          description: Now following

  # ADMIN
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform statistics (admin only)
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/balance:
    patch:
      operationId: adjustBalance
      tags: [admin]
      summary: Adjust user balance (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BalanceAdjustInput"
      responses:
        "200":
          description: Balance adjusted

  /admin/deposits:
    get:
      operationId: getAdminDeposits
      tags: [admin]
      summary: Get all deposits (admin only)
      responses:
        "200":
          description: List of deposits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deposit"

  /admin/trades:
    get:
      operationId: getAdminTrades
      tags: [admin]
      summary: Get all trades (admin only)
      responses:
        "200":
          description: List of trades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trade"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        name:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
        userId:
          type: integer
        requiresVerification:
          type: boolean
        emailSent:
          type: boolean
        devOtp:
          type: string
        message:
          type: string

    User:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        createdAt:
          type: string
        isAdmin:
          type: boolean

    Wallet:
      type: object
      required: [id, userId, balance, totalDeposited, totalProfit]
      properties:
        id:
          type: integer
        userId:
          type: integer
        balance:
          type: number
        totalDeposited:
          type: number
        totalProfit:
          type: number
        accountType:
          type: string
          enum: [real, demo]

    DashboardSummary:
      type: object
      required: [balance, totalProfit, openTrades, winRate, totalTrades, totalDeposited]
      properties:
        balance:
          type: number
        totalProfit:
          type: number
        openTrades:
          type: integer
        winRate:
          type: number
        totalTrades:
          type: integer
        totalDeposited:
          type: number
        accountType:
          type: string
          enum: [real, demo]

    MarketPrice:
      type: object
      required: [symbol, bid, ask, changePercent24h]
      properties:
        symbol:
          type: string
        bid:
          type: number
        ask:
          type: number
        changePercent24h:
          type: number

    Trade:
      type: object
      required: [id, userId, symbol, direction, amount, entryPrice, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        accountType:
          type: string
          enum: [real, demo]
        ticketNumber:
          type: string
          nullable: true
        symbol:
          type: string
        direction:
          type: string
          enum: [buy, sell]
        amount:
          type: number
        lotSize:
          type: number
          nullable: true
        marginUsed:
          type: number
          nullable: true
        entryPrice:
          type: number
        closePrice:
          type: number
          nullable: true
        stopLoss:
          type: number
          nullable: true
        takeProfit:
          type: number
          nullable: true
        profitLoss:
          type: number
          nullable: true
        profitLossPercent:
          type: number
          nullable: true
        status:
          type: string
          enum: [open, closed]
        isCopied:
          type: boolean
        copiedFromUserId:
          type: integer
          nullable: true
        createdAt:
          type: string
        closedAt:
          type: string
          nullable: true
        userName:
          type: string
          nullable: true

    TradeInput:
      type: object
      required: [symbol, direction, amount]
      properties:
        symbol:
          type: string
        direction:
          type: string
          enum: [buy, sell]
        amount:
          type: number
        lotSize:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
        accountType:
          type: string
          enum: [real, demo]
          default: real

    Deposit:
      type: object
      required: [id, userId, amount, status, phone, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        accountType:
          type: string
          enum: [real, demo]
        amount:
          type: number
        status:
          type: string
        phone:
          type: string
        mpesaReceiptNumber:
          type: string
          nullable: true
        checkoutRequestId:
          type: string
          nullable: true
        createdAt:
          type: string
        userName:
          type: string
          nullable: true

    PricePoint:
      type: object
      required: [time, value]
      properties:
        time:
          type: integer
        value:
          type: number

    TopTrader:
      type: object
      required: [userId, name, totalProfit, winRate, totalTrades]
      properties:
        userId:
          type: integer
        name:
          type: string
        totalProfit:
          type: number
        winRate:
          type: number
        totalTrades:
          type: integer

    LeaderboardEntry:
      type: object
      required: [userId, name, totalProfit, winRate, totalTrades]
      properties:
        userId:
          type: integer
        name:
          type: string
        totalProfit:
          type: number
        winRate:
          type: number
        totalTrades:
          type: integer

    FollowInput:
      type: object
      required: [traderId]
      properties:
        traderId:
          type: integer

    StkPushInput:
      type: object
      required: [phone, amount]
      properties:
        phone:
          type: string
        amount:
          type: number

    StkPushResponse:
      type: object
      properties:
        checkoutRequestId:
          type: string
        merchantRequestId:
          type: string
        responseCode:
          type: string
        customerMessage:
          type: string

    MpesaCallbackInput:
      type: object
      properties:
        Body:
          type: object
          properties:
            stkCallback:
              $ref: "#/components/schemas/MpesaCallbackInputBodyStkCallback"

    MpesaCallbackInputBodyStkCallback:
      type: object
      properties:
        MerchantRequestID:
          type: string
        CheckoutRequestID:
          type: string
        ResultCode:
          type: integer
        ResultDesc:
          type: string
        CallbackMetadata:
          type: object

    # ADMIN
    AdminUser:
      type: object
      required: [id, email, name, balance, totalDeposited, totalProfit, totalTrades, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        balance:
          type: number
        totalDeposited:
          type: number
        totalProfit:
          type: number
        totalTrades:
          type: integer
        createdAt:
          type: string
        isAdmin:
          type: boolean

    BalanceAdjustInput:
      type: object
      required: [balance]
      properties:
        balance:
          type: number
        reason:
          type: string

    AdminStats:
      type: object
      required: [totalUsers, totalDeposits, totalTrades, totalVolume, activeTraders]
      properties:
        totalUsers:
          type: integer
        totalDeposits:
          type: number
        totalTrades:
          type: integer
        totalVolume:
          type: number
        activeTraders:
          type: integer
